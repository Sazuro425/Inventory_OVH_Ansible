# Publication de l'inventaire sous Apache, comptes locaux (sans OIDC).
#
# Le temps que le client OIDC soit cree dans Authentik. infra.yml doit dire
# web.auth: local, et le service servir la page (--page, deja dans
# deploy/inventaire-web.service).
#
#   sudo a2enmod ssl headers proxy proxy_http
#   sudo cp deploy/apache-inventaire-local.conf /etc/apache2/sites-available/inventaire.conf
#   sudo a2ensite inventaire && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Difference avec apache-inventaire.conf : Apache n'authentifie personne. Il
# termine le TLS et passe tout au service, page comprise ; c'est le service
# qui exige une session, sert la carte a une session ouverte seulement, et
# renvoie les autres vers /connexion. Rien n'est servi depuis /var/www.
#
# Passer a l'OIDC : web.auth: oidc dans infra.yml, apache-inventaire.conf a
# la place de ce fichier, redemarrer le service. Les comptes locaux restent
# en base et ne servent plus.

<VirtualHost *:80>
    ServerName inventaire.exemple.lan
    # Le cookie de session est Secure (__Host-) : en clair, il n'existe pas.
    Redirect permanent / https://inventaire.exemple.lan/
</VirtualHost>

<VirtualHost *:443>
    ServerName inventaire.exemple.lan

    SSLEngine on
    # certbot --apache, ou un certificat de l'autorite interne
    SSLCertificateFile    /etc/ssl/certs/inventaire.pem
    SSLCertificateKeyFile /etc/ssl/private/inventaire.key
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/inventaire-error.log
    CustomLog ${APACHE_LOG_DIR}/inventaire-access.log combined

    # Restriction reseau, si les postes sont sur un reseau connu : sans OIDC
    # ni MFA, c'est la protection la moins chere a ajouter devant un mot de
    # passe.
    # <Location />
    #     Require ip 10.0.0.0/8 192.168.0.0/16
    # </Location>

    # En mode local, le service ignore ces en-tetes. Les effacer quand meme
    # protege du jour ou quelqu'un repasse web.auth a oidc sans changer de
    # vhost : un client ne pourrait toujours pas s'annoncer sous le nom de
    # son choix.
    RequestHeader unset X-Remote-User
    RequestHeader unset X-Remote-Groups

    # Tout au service, sur la boucle locale : la page, /connexion et l'API.
    # Le service pose lui-meme ses en-tetes de securite (CSP, nosniff,
    # X-Frame-Options, no-store) sur chaque reponse.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
