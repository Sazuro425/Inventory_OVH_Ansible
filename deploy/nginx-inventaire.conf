# Publication de la page d'inventaire.
#
#   sudo cp deploy/nginx-inventaire.conf /etc/nginx/sites-available/inventaire
#   sudo ln -s /etc/nginx/sites-available/inventaire /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# La page liste tes serveurs, leurs IP et leurs VM : c'est une cartographie de
# ton infrastructure. Elle ne doit pas etre publique, d'ou l'authentification
# ci-dessous. Creer le fichier de mots de passe :
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-inventaire evan
#   sudo chown root:www-data /etc/nginx/.htpasswd-inventaire
#   sudo chmod 640 /etc/nginx/.htpasswd-inventaire

server {
    listen 80;
    listen [::]:80;
    server_name inventaire.exemple.lan;

    root /var/www/inventaire;
    index index.html;

    access_log /var/log/nginx/inventaire-access.log;
    error_log  /var/log/nginx/inventaire-error.log;

    # Restreindre au reseau d'administration est plus solide qu'un mot de
    # passe : decommenter et ajuster si tes clients sont sur un reseau connu.
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    auth_basic "Inventaire";
    auth_basic_user_file /etc/nginx/.htpasswd-inventaire;

    # La page est regeneree a chaque collecte : pas de cache, sinon on sert un
    # inventaire perime sans le savoir.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        # La page n'a ni dependance ni appel reseau : une CSP stricte passe.
        # 'unsafe-inline' est necessaire, le script et les styles sont inlines.
        # Sur une seule ligne : nginx ne reconnait pas la continuation par
        # antislash a l'interieur d'une chaine entre guillemets.
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; frame-ancestors 'self'; base-uri 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Rien d'autre que la page n'a a etre servi
    location ~ /\. { deny all; }
}

# ---------------------------------------------------------------------------
# Variante HTTPS, une fois le certificat en place :
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d inventaire.exemple.lan
#
# certbot reecrit ce fichier pour ajouter le bloc 443 et la redirection 80.
# Sur un reseau interne sans certificat public, une autorite interne ou un
# certificat auto-signe font l'affaire : les visiteurs sont des administrateurs
# a qui tu peux demander d'ajouter la CA.
# ---------------------------------------------------------------------------
