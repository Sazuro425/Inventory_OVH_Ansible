# Publication de l'inventaire sous Apache, authentification OIDC (Authentik).
#
#   sudo apt install libapache2-mod-auth-openidc
#   sudo a2enmod ssl headers proxy proxy_http auth_openidc
#   sudo cp deploy/apache-inventaire.conf /etc/apache2/sites-available/inventaire.conf
#   sudo install -d -m 750 -o root -g www-data /etc/apache2/conf-secrets
#   sudo install -m 640 -o root -g www-data deploy/inventaire-oidc.conf.example \
#        /etc/apache2/conf-secrets/inventaire-oidc.conf      # puis le remplir
#   sudo a2ensite inventaire && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# La page cartographie l'infrastructure et porte les prix : elle n'est jamais
# servie sans authentification. Un seul mode, OIDC, pour la page comme pour
# l'API : avec deux modes (basic pour la page, OIDC pour l'API), la page
# s'ouvrait mais aucun de ses appels a l'API ne passait.
#
# Trois groupes Authentik, a declarer aussi dans infra.yml (section web) :
#   inventaire-lecture      voir la carte, la rentabilite, exporter
#   inventaire-commercial   saisir ventes, elements, corrections
#   inventaire-admin        emettre un jeton pour le client Ansible
# Apache laisse entrer les membres de l'un des trois ; le service, lui,
# distingue les roles. Les deux controles se recouvrent volontairement.

<VirtualHost *:80>
    ServerName inventaire.exemple.lan
    # L'OIDC impose HTTPS : cookies de session Secure, et Authentik refuse
    # une redirect_uri en clair hors localhost.
    Redirect permanent / https://inventaire.exemple.lan/
</VirtualHost>

<VirtualHost *:443>
    ServerName inventaire.exemple.lan

    SSLEngine on
    # certbot --apache, ou un certificat de l'autorite interne
    SSLCertificateFile    /etc/ssl/certs/inventaire.pem
    SSLCertificateKeyFile /etc/ssl/private/inventaire.key
    Header always set Strict-Transport-Security "max-age=31536000"

    DocumentRoot /var/www/inventaire
    DirectoryIndex index.html

    ErrorLog  ${APACHE_LOG_DIR}/inventaire-error.log
    # %u journalise l'identite OIDC (OIDCRemoteUserClaim la place dans
    # REMOTE_USER) : sans cela les journaux ne contiennent que des adresses,
    # ce qui ne vaut pas grand-chose pour savoir qui a consulte la carte.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" nominatif
    CustomLog ${APACHE_LOG_DIR}/inventaire-access.log nominatif

    # Client, secret, passphrase des cookies : hors du depot, lisible par
    # root et www-data seulement. Include et non IncludeOptional : sans ce
    # fichier, Apache doit refuser de demarrer plutot que de servir une page
    # dont l'authentification ne fonctionne pas.
    Include /etc/apache2/conf-secrets/inventaire-oidc.conf

    <Directory /var/www/inventaire>
        Options -Indexes -FollowSymLinks
        AllowOverride None
    </Directory>

    # -----------------------------------------------------------------
    # Tout le site : OIDC, et l'un des trois groupes
    # -----------------------------------------------------------------
    <Location />
        AuthType openid-connect
        <RequireAny>
            Require claim groups:inventaire-lecture
            Require claim groups:inventaire-commercial
            Require claim groups:inventaire-admin
        </RequireAny>

        # Restriction reseau en plus, si les postes sont sur un reseau connu :
        # <RequireAll>
        #     Require ip 10.0.0.0/8 192.168.0.0/16
        #     <RequireAny> ... les trois groupes ... </RequireAny>
        # </RequireAll>
    </Location>

    # La page est regeneree a chaque collecte : pas de cache, sinon on sert un
    # inventaire perime sans le savoir.
    <Files "index.html">
        Header always set Cache-Control "no-store, must-revalidate"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
    # La page n'a aucune dependance externe : une CSP stricte passe.
    # 'unsafe-inline' reste ici parce qu'Apache ne connait pas les empreintes
    # de la page, qui changent a chaque collecte ; mais la page porte sa propre
    # CSP (balise meta, csp.py) qui n'autorise que son script et son style par
    # empreinte SHA-256. Le navigateur applique les deux : un script injecte
    # est refuse.
    # connect-src 'self' laisse la page appeler l'API du meme hote, et rien
    # d'autre : sans lui, default-src 'none' bloque tous ses fetch().
    Header always set Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; form-action 'none'; frame-ancestors 'self'; base-uri 'none'"

    # Rien d'autre que la page n'a a etre servi
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # -----------------------------------------------------------------
    # Service d'API, sur la boucle locale
    # -----------------------------------------------------------------
    # L'identite est transmise par en-tetes. Il faut d'abord effacer ceux
    # qu'un client aurait envoyes lui-meme : sans ces unset, n'importe qui
    # s'annoncerait comme l'administrateur de son choix, ou membre du groupe
    # commercial.
    RequestHeader unset X-Remote-User
    RequestHeader unset X-Remote-Groups

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # Toutes les routes de l'API sauf inventaire et sante : identite et
    # groupes reposes ici, apres l'OIDC, et seulement ici.
    #
    # OIDCUnAuthAction 401 : une session expiree renvoie 401 au lieu d'une
    # redirection vers Authentik. fetch() suivrait cette redirection vers un
    # autre domaine et echouerait sur une erreur CORS muette ; un 401, la
    # page sait le lire et proposer de se reconnecter.
    <LocationMatch "^/api/(?!inventaire$|sante$)">
        OIDCUnAuthAction 401
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        RequestHeader set X-Remote-Groups "%{OIDC_CLAIM_groups}e"
    </LocationMatch>

    # Recuperation de l'inventaire : volontairement hors OIDC. Le client
    # n'est pas un navigateur, il ne peut pas suivre une redirection ; c'est
    # le jeton porte par l'en-tete Authorization que le service valide
    # lui-meme, et il ne sert qu'une fois.
    <LocationMatch "^/api/(inventaire|sante)$">
        AuthType None
        Require all granted
    </LocationMatch>
</VirtualHost>
