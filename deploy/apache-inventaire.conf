# Publication de la page d'inventaire sous Apache.
#
#   sudo a2enmod headers proxy proxy_http
#   sudo cp deploy/apache-inventaire.conf /etc/apache2/sites-available/inventaire.conf
#   sudo a2ensite inventaire && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Deux modes d'authentification, au choix :
#   A. Basic      — immediat, un fichier htpasswd (bloc actif par defaut)
#   B. OIDC       — delegue a Authentik (bloc plus bas, a decommenter)
#
# La page cartographie l'infrastructure : serveurs, IP, VM, systemes. Elle ne
# doit jamais etre servie sans authentification.

<VirtualHost *:80>
    ServerName inventaire.exemple.lan

    DocumentRoot /var/www/inventaire
    DirectoryIndex index.html

    ErrorLog  ${APACHE_LOG_DIR}/inventaire-error.log
    # %u journalise l'identite OIDC (OIDCRemoteUserClaim la place dans
    # REMOTE_USER) : sans cela les journaux ne contiennent que des adresses,
    # ce qui ne vaut pas grand-chose pour savoir qui a consulte la carte.
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" nominatif
    CustomLog ${APACHE_LOG_DIR}/inventaire-access.log nominatif

    <Directory /var/www/inventaire>
        Options -Indexes -FollowSymLinks
        AllowOverride None

        # --- A. Authentification basic ------------------------------------
        # sudo htpasswd -c /etc/apache2/.htpasswd-inventaire evan
        # sudo chown root:www-data /etc/apache2/.htpasswd-inventaire
        # sudo chmod 640 /etc/apache2/.htpasswd-inventaire
        AuthType Basic
        AuthName "Inventaire"
        AuthUserFile /etc/apache2/.htpasswd-inventaire
        Require valid-user

        # --- B. OIDC via Authentik ----------------------------------------
        # Remplacer le bloc A par les trois lignes suivantes, apres avoir
        # renseigne /etc/apache2/conf-secrets/inventaire-oidc.conf :
        #
        # AuthType openid-connect
        # Require valid-user
        #
        # L'URL de retour (/oidc-callback, definie par OIDCRedirectURI) est
        # interceptee par le module : elle doit etre couverte par ce bloc et
        # ne correspondre a aucun fichier du disque.
        #
        # Restreindre a un groupe Authentik plutot qu'a tout utilisateur
        # authentifie (le claim "groups" doit etre expose par le provider) :
        # Require claim groups:infra-admins

        # Restriction par reseau, plus solide qu'un mot de passe quand les
        # clients sont sur un reseau d'administration connu. Se cumule avec
        # l'authentification si on ajoute "AuthMerging And".
        # <RequireAll>
        #     Require ip 10.0.0.0/8 192.168.0.0/16
        #     Require valid-user
        # </RequireAll>
    </Directory>

    # La page est regeneree a chaque collecte : pas de cache, sinon on sert un
    # inventaire perime sans le savoir.
    <Files "index.html">
        Header always set Cache-Control "no-store, must-revalidate"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
    # La page n'a ni dependance ni appel reseau : une CSP stricte passe.
    # 'unsafe-inline' est requis, script et styles sont inlines dans la page.
    Header always set Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; frame-ancestors 'self'; base-uri 'none'"

    # Rien d'autre que la page n'a a etre servi
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # -----------------------------------------------------------------
    # Service d'API, sur la boucle locale
    # -----------------------------------------------------------------
    # L'identite authentifiee est transmise par un en-tete. Il faut donc
    # d'abord effacer celui qu'un client pourrait avoir envoye lui-meme :
    # sans ce unset, n'importe qui s'annoncerait comme l'administrateur de
    # son choix.
    RequestHeader unset X-Remote-User

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # Emission d'un jeton : reservee aux humains authentifies. C'est la
    # seule route ou l'en-tete d'identite est repose, apres l'OIDC.
    <Location /api/token>
        AuthType openid-connect
        Require valid-user
        # Require claim groups:infra-admins
        RequestHeader set X-Remote-User %{REMOTE_USER}s
    </Location>

    # Recuperation de l'inventaire : volontairement hors authentification
    # Apache. Le client n'est pas un navigateur, il ne peut pas suivre une
    # redirection OIDC ; c'est le jeton porte par l'en-tete Authorization
    # que le service valide lui-meme, et il ne sert qu'une fois.
    <Location /api/inventaire>
        Require all granted
    </Location>

    <Location /api/sante>
        Require all granted
    </Location>

    # Les identifiants et jetons du module OIDC vivent dans un fichier separe,
    # lisible seulement par root et www-data : ce vhost reste versionnable.
    IncludeOptional /etc/apache2/conf-secrets/inventaire-oidc.conf
</VirtualHost>

# ---------------------------------------------------------------------------
# HTTPS
#
# L'OIDC impose de fait HTTPS : les cookies de session sont poses en Secure et
# Authentik refusera une redirect_uri en clair hors localhost.
#
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d inventaire.exemple.lan
#
# Sur un reseau interne, un certificat d'une autorite interne fait l'affaire :
# les visiteurs sont des administrateurs a qui tu peux demander d'ajouter la CA.
# ---------------------------------------------------------------------------
