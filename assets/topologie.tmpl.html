<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITRE__</title>
<style>
  :root {
    --fond:#0d1117; --fond2:#010409; --carte:#161b22; --carte2:#1c2230;
    --trait:#30363d; --trait2:#3d444d; --texte:#e6edf3; --doux:#8b949e;
    --lien:#30363d; --accent:#2f81f7; --accent-doux:rgba(47,129,247,.15);
    --vert:#3fb950; --gris:#6e7681; --rouge:#f85149; --ambre:#d29922;
    --ombre:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(1,4,9,.6);
    --r:10px;
  }
  :root[data-theme="light"] {
    --fond:#ffffff; --fond2:#f6f8fa; --carte:#ffffff; --carte2:#f6f8fa;
    --trait:#d1d9e0; --trait2:#b7bfc8; --texte:#1f2328; --doux:#59636e;
    --lien:#d1d9e0; --accent:#0969da; --accent-doux:rgba(9,105,218,.1);
    --vert:#1a7f37; --gris:#818b98; --rouge:#cf222e; --ambre:#9a6700;
    --ombre:0 1px 3px rgba(31,35,40,.12);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--fond); color:var(--texte);
    font:13.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- barre du haut ---------- */
  header {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 16px; background:var(--fond2);
    border-bottom:1px solid var(--trait); flex:0 0 auto; z-index:3;
  }
  .marque { font-weight:600; font-size:14px; letter-spacing:-.01em; }
  .marque small { display:block; font-weight:400; font-size:11px; color:var(--doux); }
  .stats { display:flex; gap:7px; flex-wrap:wrap; }
  .stat {
    background:var(--carte); border:1px solid var(--trait); border-radius:7px;
    padding:4px 10px; line-height:1.25; white-space:nowrap;
  }
  .stat b { font-size:14px; font-weight:600; }
  .stat span { font-size:10px; color:var(--doux); display:block;
               text-transform:uppercase; letter-spacing:.05em; }
  .stat .sur { font-style:normal; font-weight:400; font-size:11px;
               color:var(--doux); }
  .stats.filtre .stat { border-color:var(--accent); }
  .pousse { margin-left:auto; }
  .outils { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  button, select, input[type=search] {
    font:inherit; font-size:12.5px; color:var(--texte); background:var(--carte);
    border:1px solid var(--trait); border-radius:7px; padding:5px 10px;
    cursor:pointer; transition:background .12s, border-color .12s;
  }
  button:hover, select:hover { background:var(--carte2); border-color:var(--trait2); }
  button:active { transform:translateY(1px); }
  button.actif { background:var(--accent-doux); border-color:var(--accent);
                 color:var(--accent); }
  input[type=search] { cursor:text; min-width:150px; }
  input[type=search]:focus, select:focus, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px;
  }

  /* ---------- filtres ---------- */
  .filtres {
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:8px 16px; background:var(--fond2);
    border-bottom:1px solid var(--trait); flex:0 0 auto; z-index:2;
    /* avec une quinzaine de clusters, les filtres mangeaient un tiers de la
       hauteur utile : on les borne et on fait defiler au-dela */
    max-height:26vh; overflow-y:auto;
  }
  .filtres.replie { display:none; }
  .groupe { display:flex; gap:5px; align-items:center; }
  .groupe > label {
    font-size:10.5px; color:var(--doux); text-transform:uppercase;
    letter-spacing:.05em; margin-right:1px;
  }
  .puce {
    display:inline-flex; align-items:center; gap:5px; font-size:12px;
    background:var(--carte); border:1px solid var(--trait); border-radius:999px;
    padding:3px 10px; cursor:pointer; user-select:none;
  }
  .puce:hover { border-color:var(--trait2); }
  .puce.off { opacity:.4; }
  .puce i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .puce .n { color:var(--doux); font-size:11px; }

  /* ---------- canevas ---------- */
  .scene { position:relative; flex:1 1 auto; overflow:hidden; cursor:grab;
           background:var(--fond); }
  .scene.deplace { cursor:grabbing; }
  svg { display:block; width:100%; height:100%; touch-action:none; }
  .grille { fill:url(#points); }

  .lien { fill:none; stroke:var(--lien); stroke-width:1.5; }
  .lien.attenue { opacity:.25; }

  .noeud { cursor:grab; }
  .noeud.saisi { cursor:grabbing; }
  .noeud .fond {
    fill:var(--carte); stroke:var(--trait); stroke-width:1;
    filter:drop-shadow(0 4px 10px rgba(1,4,9,.35));
  }
  :root[data-theme="light"] .noeud .fond { filter:drop-shadow(0 1px 2px rgba(31,35,40,.12)); }
  .noeud:hover .fond { stroke:var(--trait2); }
  .noeud.cible .fond { stroke:var(--accent); stroke-width:1.6; }
  .noeud.attenue { opacity:.22; }
  .noeud .bande { stroke:none; }
  .noeud .titre { font-size:12.5px; font-weight:600; fill:var(--texte); }
  .noeud .detail { font-size:11px; fill:var(--doux); }
  .noeud .badge { font-size:10px; fill:var(--doux); text-anchor:end; }
  .noeud .plier {
    font-size:11px; font-weight:600; fill:var(--doux); text-anchor:middle;
    cursor:pointer;
  }
  .noeud .plier-fond { fill:var(--carte2); stroke:var(--trait); cursor:pointer; }
  .noeud.deplace-main .fond { stroke:var(--ambre); stroke-dasharray:3 2; }
  /* machine du parc dont l'acces bastion n'est pas declare : elle existe mais
     restera injoignable, d'ou un contour d'alerte plutot qu'un simple badge */
  .noeud.sans-acces .fond { stroke:var(--ambre); stroke-width:1.6; }
  .noeud .marque-acces { font-size:10px; text-anchor:end; fill:var(--ambre); }

  /* ---------- panneau de details ---------- */
  .fiche {
    position:absolute; top:14px; right:14px; width:290px; max-height:calc(100% - 28px);
    overflow:auto; background:var(--carte); border:1px solid var(--trait);
    border-radius:var(--r); box-shadow:var(--ombre); padding:14px 16px;
    display:none; z-index:4;
  }
  .fiche.visible { display:block; }
  .fiche h3 { margin:0 0 2px; font-size:14px; }
  .fiche .type { color:var(--doux); font-size:11px; text-transform:uppercase;
                 letter-spacing:.05em; margin-bottom:10px; }
  .fiche dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .fiche dt { color:var(--doux); font-size:11.5px; }
  .fiche dd { margin:0; font-size:12px; word-break:break-word; }
  .fiche .fermer { position:absolute; top:10px; right:10px; padding:2px 7px; }

  .fiche.jeton { width:360px; }
  .fiche pre {
    background:var(--carte2); border:1px solid var(--trait); border-radius:7px;
    padding:9px 11px; font-size:11.5px; white-space:pre-wrap; word-break:break-all;
    margin:0 0 10px; user-select:all;
  }
  .fiche .note { color:var(--doux); font-size:11.5px; margin:10px 0 0; }

  .vide {
    position:absolute; inset:0; display:none; align-items:center;
    justify-content:center; color:var(--doux); font-size:13px;
  }
  .vide.visible { display:flex; }

  .aide {
    position:absolute; left:14px; bottom:12px; color:var(--doux);
    font-size:11px; background:var(--fond2); border:1px solid var(--trait);
    border-radius:7px; padding:5px 10px; pointer-events:none; opacity:.85;
  }

  @media (max-width:760px) {
    .stats { display:none; }
    .fiche { width:calc(100% - 28px); }
  }
</style>
</head>
<body>

<header>
  <div class="marque">__TITRE__<small id="horodatage">—</small></div>
  <div class="stats" id="stats"></div>
  <div class="outils pousse">
    <input type="search" id="recherche" placeholder="Rechercher…" autocomplete="off">
    <button id="btn-filtres" title="Afficher ou masquer les filtres">Filtres</button>
    <button id="btn-plier" title="Replier tous les hyperviseurs">Replier</button>
    <button id="btn-ajuster" title="Ajuster à l'écran">Ajuster</button>
    <button id="btn-reinit" title="Réinitialiser positions et filtres">Réinitialiser</button>
    <button id="btn-jeton" title="Obtenir un jeton pour le client">Jeton</button>
    <button id="btn-theme" title="Thème clair ou sombre">◐</button>
  </div>
</header>

<div class="filtres" id="filtres"></div>

<div class="scene" id="scene">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="points" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="currentColor" opacity=".10"/>
      </pattern>
    </defs>
    <rect class="grille" x="-20000" y="-20000" width="40000" height="40000"
          color="var(--doux)"/>
    <g id="monde">
      <g id="liens"></g>
      <g id="noeuds"></g>
    </g>
  </svg>
  <div class="vide" id="vide">Aucun élément ne correspond aux filtres.</div>
  <div class="aide">Glisser une carte pour la déplacer · molette pour zoomer · clic pour les détails</div>
  <aside class="fiche jeton" id="boite-jeton">
    <button class="fermer" id="jeton-fermer">✕</button>
    <h3>Jeton pour le client</h3>
    <div class="type" id="jeton-etat">…</div>
    <pre id="jeton-cmd"></pre>
    <button id="jeton-copier">Copier la commande</button>
    <p class="note" id="jeton-note"></p>
  </aside>
  <aside class="fiche" id="fiche">
    <button class="fermer" id="fiche-fermer">✕</button>
    <h3 id="fiche-titre"></h3>
    <div class="type" id="fiche-type"></div>
    <dl id="fiche-corps"></dl>
  </aside>
</div>

<script>
const DONNEES = __DATA__;

// ---------------------------------------------------------------- constantes
const TAILLE = {
  dc:   { w: 150, h: 54 },
  srv:  { w: 236, h: 80 },
  node: { w: 220, h: 80 },
  vm:   { w: 210, h: 60 },
};
const ECART_X = 86, ECART_Y = 16, MARGE = 40;
const CLE = 'topologie:' + (DONNEES.cle || 'defaut');

const COULEUR = {
  running: 'var(--vert)', stopped: 'var(--gris)',
  unreachable: 'var(--rouge)', dc: 'var(--accent)', srv: 'var(--accent)',
};

// ------------------------------------------------------------------- etat
const etat = {
  plies: new Set(),        // noeuds dont les enfants sont masques
  decales: {},             // id -> {dx, dy} deplacement manuel
  filtres: {},             // famille -> Set de valeurs exclues
  recherche: '',
  vue: { x: 0, y: 0, k: 1 },
  selection: null,
};

try {
  const sauve = JSON.parse(localStorage.getItem(CLE) || '{}');
  if (sauve.plies) etat.plies = new Set(sauve.plies);
  if (sauve.decales) etat.decales = sauve.decales;
  if (sauve.filtres) for (const [k, v] of Object.entries(sauve.filtres))
    etat.filtres[k] = new Set(v);
  if (sauve.theme) document.documentElement.dataset.theme = sauve.theme;
  if (sauve.vue) etat.vue = sauve.vue;
} catch (err) { /* stockage indisponible : on part d'un etat neuf */ }

function sauver() {
  try {
    localStorage.setItem(CLE, JSON.stringify({
      plies: [...etat.plies],
      decales: etat.decales,
      filtres: Object.fromEntries(
        Object.entries(etat.filtres).map(([k, v]) => [k, [...v]])),
      theme: document.documentElement.dataset.theme,
      vue: etat.vue,
    }));
  } catch (err) { /* mode prive, quota : on continue sans persistance */ }
}

// ------------------------------------------------------------------- arbre
const parId = new Map(DONNEES.noeuds.map(n => [n.id, n]));
for (const n of DONNEES.noeuds) n.enfants = [];
const racines = [];
for (const n of DONNEES.noeuds) {
  const p = n.parent ? parId.get(n.parent) : null;
  if (p) p.enfants.push(n); else racines.push(n);
}

function passeFiltres(n) {
  for (const [famille, exclus] of Object.entries(etat.filtres)) {
    if (!exclus.size) continue;
    const v = n.meta && n.meta[famille];
    if (v !== undefined && exclus.has(String(v))) return false;
  }
  return true;
}

const cacheFiltre = new Map();
function visible(n) {
  if (etat.recherche && !correspondBranche(n)) return false;
  // Un noeud qui ne passe pas les filtres reste affiche si un descendant les
  // passe : sinon masquer un hyperviseur emporterait les VM qu'on cherche
  // justement a voir, et l'arbre perdrait son chemin.
  if (cacheFiltre.has(n.id)) return cacheFiltre.get(n.id);
  const ok = passeFiltres(n) || n.enfants.some(c => visible(c));
  cacheFiltre.set(n.id, ok);
  return ok;
}

function correspond(n) {
  const q = etat.recherche;
  if (!q) return true;
  return (n.recherche || '').includes(q);
}

const cacheBranche = new Map();
function correspondBranche(n) {
  if (cacheBranche.has(n.id)) return cacheBranche.get(n.id);
  let ok = correspond(n) || n.enfants.some(c => correspondBranche(c));
  if (!ok) {  // ou bien un ancetre correspond
    let p = n.parent ? parId.get(n.parent) : null;
    while (p && !ok) { ok = correspond(p); p = p.parent ? parId.get(p.parent) : null; }
  }
  cacheBranche.set(n.id, ok);
  return ok;
}

function enfantsVisibles(n) {
  if (etat.plies.has(n.id)) return [];
  return n.enfants.filter(visible);
}

// ------------------------------------------------------------------ layout
function hauteur(n) {
  const kids = enfantsVisibles(n);
  if (!kids.length) return TAILLE[n.kind].h;
  const somme = kids.reduce((s, c) => s + hauteur(c), 0);
  return somme + ECART_Y * (kids.length - 1);
}

function placer(n, x, y) {
  const t = TAILLE[n.kind];
  const total = hauteur(n);
  n.x = x; n.y = y + (total - t.h) / 2;
  const d = etat.decales[n.id];
  if (d) { n.x += d.dx; n.y += d.dy; }
  let curseur = y;
  for (const c of enfantsVisibles(n)) {
    placer(c, x + t.w + ECART_X, curseur);
    curseur += hauteur(c) + ECART_Y;
  }
  return total;
}

function disposer() {
  cacheBranche.clear();
  cacheFiltre.clear();
  let y = MARGE;
  const vues = racines.filter(visible);
  for (const r of vues) { placer(r, MARGE, y); y += hauteur(r) + 48; }
  return vues;
}

// ------------------------------------------------------------------- rendu
const elLiens = document.getElementById('liens');
const elNoeuds = document.getElementById('noeuds');
const elMonde = document.getElementById('monde');
const svg = document.getElementById('svg');

function svgEl(nom, attrs, texte) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', nom);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (texte !== undefined) el.textContent = texte;
  return el;
}

function dessiner() {
  const vues = disposer();
  elLiens.replaceChildren();
  elNoeuds.replaceChildren();

  const pile = [...vues];
  let compte = 0;
  while (pile.length) {
    const n = pile.pop();
    compte++;
    const t = TAILLE[n.kind];
    const kids = enfantsVisibles(n);

    for (const c of kids) {
      const x1 = n.x + t.w, y1 = n.y + t.h / 2;
      const x2 = c.x, y2 = c.y + TAILLE[c.kind].h / 2;
      const m = (x1 + x2) / 2;
      elLiens.appendChild(svgEl('path', {
        class: 'lien', d: `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`,
      }));
      pile.push(c);
    }

    const g = svgEl('g', { class: 'noeud', 'data-id': n.id,
                           transform: `translate(${n.x},${n.y})` });
    g.appendChild(svgEl('rect', { class: 'fond', width: t.w, height: t.h, rx: 10 }));
    g.appendChild(svgEl('rect', {
      class: 'bande', width: 4, height: t.h, rx: 2,
      fill: COULEUR[n.etat] || COULEUR[n.kind] || 'var(--doux)' }));
    // le titre ne doit jamais passer sous le badge : on le tronque sur la
    // place reellement disponible (~6.4 px par caractere a 12.5 px)
    const placeBadge = n.badge ? n.badge.length * 5.6 + 12 : 0;
    const maxCar = Math.max(6, Math.floor((t.w - 26 - placeBadge) / 6.4));
    const titre = n.titre.length > maxCar
      ? n.titre.slice(0, maxCar - 1) + '…' : n.titre;
    const elTitre = svgEl('text', { class: 'titre', x: 14, y: 21 }, titre);
    if (titre !== n.titre) elTitre.appendChild(svgEl('title', {}, n.titre));
    g.appendChild(elTitre);
    (n.lignes || []).forEach((l, i) =>
      g.appendChild(svgEl('text', { class: 'detail', x: 14, y: 38 + i * 15 }, l)));
    if (n.badge)
      g.appendChild(svgEl('text', { class: 'badge', x: t.w - 12, y: 21 }, n.badge));

    if (n.enfants.length) {
      const plie = etat.plies.has(n.id);
      const bx = t.w - 13, by = t.h - 13;
      const btn = svgEl('g', { class: 'plier-grp' });
      btn.appendChild(svgEl('circle', { class: 'plier-fond', cx: bx, cy: by, r: 9 }));
      btn.appendChild(svgEl('text', { class: 'plier', x: bx, y: by + 4 },
                            plie ? '+' + n.enfants.length : '–'));
      btn.addEventListener('pointerdown', ev => {
        ev.stopPropagation();
        plie ? etat.plies.delete(n.id) : etat.plies.add(n.id);
        sauver(); dessiner();
      });
      g.appendChild(btn);
    }
    // conserve pour sa descendance, mais hors du filtre : on l'attenue pour
    // qu'il ne soit pas lu comme un resultat
    if (!passeFiltres(n)) g.classList.add('attenue');
    if (n.meta && n.meta.acces === 'manquant') {
      g.classList.add('sans-acces');
      g.appendChild(svgEl('text',
        { class: 'marque-acces', x: t.w - 12, y: t.h - 8 }, 'sans accès'));
    }
    if (etat.decales[n.id]) g.classList.add('deplace-main');
    if (etat.selection === n.id) g.classList.add('cible');
    elNoeuds.appendChild(g);
  }

  document.getElementById('vide').classList.toggle('visible', compte === 0);
  construireStats();
  appliquerVue();
}

// -------------------------------------------------------------- vue (pan/zoom)
function appliquerVue() {
  const { x, y, k } = etat.vue;
  elMonde.setAttribute('transform', `translate(${x},${y}) scale(${k})`);
}

function ajuster() {
  const boite = elNoeuds.getBBox();
  if (!boite.width) return;
  const r = svg.getBoundingClientRect();
  let k = Math.min((r.width - 60) / boite.width, (r.height - 60) / boite.height, 1.4);
  // en dessous de ce seuil le texte est illisible : on cadre en haut a gauche
  // plutot que de tout faire tenir a l'ecran
  const LISIBLE = 0.45;
  if (k < LISIBLE) {
    k = LISIBLE;
    etat.vue = { k, x: 30 - boite.x * k, y: 30 - boite.y * k };
  } else {
    etat.vue = {
      k,
      x: (r.width - boite.width * k) / 2 - boite.x * k,
      y: (r.height - boite.height * k) / 2 - boite.y * k,
    };
  }
  appliquerVue(); sauver();
}

const scene = document.getElementById('scene');
scene.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  const k = Math.min(3, Math.max(0.15, etat.vue.k * f));
  // zoom centre sur le pointeur
  etat.vue.x = sx - (sx - etat.vue.x) * (k / etat.vue.k);
  etat.vue.y = sy - (sy - etat.vue.y) * (k / etat.vue.k);
  etat.vue.k = k;
  appliquerVue(); sauver();
}, { passive: false });

// --------------------------------------------------------- glisser (pan + noeud)
let glisse = null;

scene.addEventListener('pointerdown', ev => {
  const g = ev.target.closest('.noeud');
  if (ev.target.closest('.plier-grp')) return;
  if (g) {
    const n = parId.get(g.dataset.id);
    glisse = { type: 'noeud', n, g, x0: ev.clientX, y0: ev.clientY,
               d0: { ...(etat.decales[n.id] || { dx: 0, dy: 0 }) }, bouge: false };
    g.classList.add('saisi');
  } else {
    glisse = { type: 'vue', x0: ev.clientX, y0: ev.clientY,
               v0: { ...etat.vue }, bouge: false };
    scene.classList.add('deplace');
  }
  scene.setPointerCapture(ev.pointerId);
});

scene.addEventListener('pointermove', ev => {
  if (!glisse) return;
  const dx = ev.clientX - glisse.x0, dy = ev.clientY - glisse.y0;
  if (Math.abs(dx) + Math.abs(dy) > 3) glisse.bouge = true;
  if (glisse.type === 'vue') {
    etat.vue.x = glisse.v0.x + dx; etat.vue.y = glisse.v0.y + dy;
    appliquerVue();
  } else {
    const k = etat.vue.k;
    etat.decales[glisse.n.id] = {
      dx: glisse.d0.dx + dx / k, dy: glisse.d0.dy + dy / k };
    const n = glisse.n;
    glisse.g.setAttribute('transform',
      `translate(${n.x - glisse.d0.dx + etat.decales[n.id].dx},` +
      `${n.y - glisse.d0.dy + etat.decales[n.id].dy})`);
  }
});

scene.addEventListener('pointerup', ev => {
  if (!glisse) return;
  scene.classList.remove('deplace');
  if (glisse.type === 'noeud') {
    glisse.g.classList.remove('saisi');
    if (glisse.bouge) { sauver(); dessiner(); }
    else { selectionner(glisse.n); }
  } else if (glisse.bouge) sauver();
  glisse = null;
});

// ------------------------------------------------------------------- fiche
const fiche = document.getElementById('fiche');
function selectionner(n) {
  etat.selection = n.id;
  document.getElementById('fiche-titre').textContent = n.titre;
  document.getElementById('fiche-type').textContent = n.libelle || n.kind;
  const dl = document.getElementById('fiche-corps');
  dl.replaceChildren();
  for (const [k, v] of Object.entries(n.fiche || {})) {
    if (v === null || v === '' || v === undefined) continue;
    dl.appendChild(Object.assign(document.createElement('dt'), { textContent: k }));
    dl.appendChild(Object.assign(document.createElement('dd'), { textContent: v }));
  }
  fiche.classList.add('visible');
  dessiner();
}
document.getElementById('fiche-fermer').onclick = () => {
  fiche.classList.remove('visible'); etat.selection = null; dessiner();
};

// ----------------------------------------------------------------- filtres
function construireFiltres() {
  const zone = document.getElementById('filtres');
  zone.replaceChildren();
  for (const f of DONNEES.filtres) {
    const grp = document.createElement('div');
    grp.className = 'groupe';
    grp.appendChild(Object.assign(document.createElement('label'),
                                  { textContent: f.libelle }));
    etat.filtres[f.cle] = etat.filtres[f.cle] || new Set();
    for (const v of f.valeurs) {
      const puce = document.createElement('span');
      puce.className = 'puce';
      if (etat.filtres[f.cle].has(String(v.val))) puce.classList.add('off');
      if (v.couleur) {
        const i = document.createElement('i');
        i.style.background = v.couleur;
        puce.appendChild(i);
      }
      puce.appendChild(document.createTextNode(v.libelle));
      const n = document.createElement('span');
      n.className = 'n'; n.textContent = v.n;
      puce.appendChild(n);
      puce.onclick = () => {
        const s = etat.filtres[f.cle];
        s.has(String(v.val)) ? s.delete(String(v.val)) : s.add(String(v.val));
        puce.classList.toggle('off');
        sauver(); dessiner();
      };
      grp.appendChild(puce);
    }
    zone.appendChild(grp);
  }
}

// ------------------------------------------------------------------ en-tete
function goDepuisMo(mo) {
  return (Math.round(mo / 1024 * 10) / 10).toLocaleString('fr-FR') + ' Go';
}

function totaux(filtre) {
  // Le pliage n'entre pas en compte : replier une branche est un confort
  // d'affichage, pas un filtre. Seuls les filtres et la recherche reduisent
  // le perimetre, sinon les totaux bougeraient en ouvrant une branche.
  const t = { dedies: 0, hyperviseurs: 0, invites: 0, marche: 0,
              vcpu: 0, ram: 0, sansAcces: 0 };
  for (const n of DONNEES.noeuds) {
    if (n.hors_parc) continue;
    if (filtre && !(passeFiltres(n) && correspond(n))) continue;
    const m = n.mesures || {};
    if (n.kind === 'srv') {
      t.dedies++;
      if (n.meta && n.meta.acces === 'manquant') t.sansAcces++;
    } else if (n.kind === 'node') {
      if (n.etat !== 'unreachable') t.hyperviseurs++;
    } else if (n.kind === 'vm') {
      t.invites++;
      if (n.etat === 'running') t.marche++;
      t.vcpu += m.cpus || 0;
      t.ram += m.ram_mb || 0;
      if (n.meta && n.meta.acces === 'manquant') t.sansAcces++;
    }
  }
  return t;
}

function filtreActif() {
  if (etat.recherche) return true;
  return Object.values(etat.filtres).some(s => s.size);
}

function construireStats() {
  const z = document.getElementById('stats');
  const actif = filtreActif();
  const vu = totaux(true);
  const tout = actif ? totaux(false) : vu;
  const lignes = [
    ['Dédiés', vu.dedies, tout.dedies],
    ['Hyperviseurs', vu.hyperviseurs, tout.hyperviseurs],
    ['Invités', vu.invites, tout.invites],
    ['En marche', vu.marche, tout.marche],
    ['vCPU alloués', vu.vcpu, tout.vcpu],
    ['RAM allouée', vu.ram, tout.ram, goDepuisMo],
  ];
  if (tout.sansAcces) lignes.push(['Sans accès', vu.sansAcces, tout.sansAcces]);

  z.replaceChildren();
  z.classList.toggle('filtre', actif);
  for (const [libelle, valeur, total, format] of lignes) {
    const d = document.createElement('div');
    d.className = 'stat';
    const b = document.createElement('b');
    b.textContent = format ? format(valeur) : valeur.toLocaleString('fr-FR');
    d.appendChild(b);
    // Le total d'origine reste affiche quand un filtre reduit le perimetre :
    // sans lui, on croirait regarder tout le parc.
    if (actif && valeur !== total) {
      const sur = document.createElement('i');
      sur.className = 'sur';
      sur.textContent = ' / ' + (format ? format(total)
                                        : total.toLocaleString('fr-FR'));
      b.appendChild(sur);
    }
    d.appendChild(Object.assign(document.createElement('span'),
                                { textContent: libelle }));
    z.appendChild(d);
  }
  document.getElementById('horodatage').textContent =
    'Snapshot du ' + DONNEES.horodatage + (actif ? ' · vue filtrée' : '');
}

// ------------------------------------------------------------------ actions
document.getElementById('recherche').addEventListener('input', ev => {
  etat.recherche = ev.target.value.trim().toLowerCase();
  dessiner();
});
document.getElementById('btn-filtres').onclick = ev => {
  document.getElementById('filtres').classList.toggle('replie');
  ev.target.classList.toggle('actif');
};
document.getElementById('btn-plier').onclick = ev => {
  const pliables = DONNEES.noeuds.filter(n => n.kind === 'node' && n.enfants.length);
  const tout = pliables.every(n => etat.plies.has(n.id));
  pliables.forEach(n => tout ? etat.plies.delete(n.id) : etat.plies.add(n.id));
  ev.target.textContent = tout ? 'Replier' : 'Déplier';
  sauver(); dessiner();
};
document.getElementById('btn-ajuster').onclick = ajuster;
document.getElementById('btn-reinit').onclick = () => {
  etat.plies.clear(); etat.decales = {}; etat.recherche = '';
  for (const k of Object.keys(etat.filtres)) etat.filtres[k].clear();
  document.getElementById('recherche').value = '';
  construireFiltres(); sauver(); dessiner(); ajuster();
};
// ----------------------------------------------------------------- jeton
const boiteJeton = document.getElementById('boite-jeton');
document.getElementById('jeton-fermer').onclick =
  () => boiteJeton.classList.remove('visible');

document.getElementById('btn-jeton').onclick = async () => {
  boiteJeton.classList.add('visible');
  const etat = document.getElementById('jeton-etat');
  const cmd = document.getElementById('jeton-cmd');
  const note = document.getElementById('jeton-note');
  etat.textContent = 'demande en cours…';
  cmd.textContent = ''; note.textContent = '';
  try {
    // meme origine : le cookie de session OIDC part avec la requete
    const r = await fetch('api/token', { method: 'POST', credentials: 'same-origin' });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      etat.textContent = 'refus (' + r.status + ')';
      note.textContent = d.erreur || (r.status === 401
        ? "Session expiree : recharge la page pour te reauthentifier."
        : "Le service d'inventaire n'a pas repondu comme attendu.");
      return;
    }
    const d = await r.json();
    etat.textContent = 'valable ' + d.expire_dans_min + ' min, une seule fois';
    cmd.textContent = 'infra update --token ' + d.token;
    note.textContent = 'Emis pour ' + d.emis_par
      + '. Un jeton deja utilise est refuse : si le client echoue, reprends-en un.';
  } catch (err) {
    // page ouverte sans le service derriere (fichier local, par exemple)
    etat.textContent = 'service injoignable';
    note.textContent = "Cette page est servie sans son service d'API : "
      + "le jeton ne peut pas etre emis d'ici.";
  }
};

document.getElementById('jeton-copier').onclick = async () => {
  const cmd = document.getElementById('jeton-cmd').textContent;
  if (!cmd) return;
  const bouton = document.getElementById('jeton-copier');
  try {
    await navigator.clipboard.writeText(cmd);
    bouton.textContent = 'copie';
  } catch (err) {
    // presse-papiers refuse hors contexte securise : on selectionne a la place
    const plage = document.createRange();
    plage.selectNodeContents(document.getElementById('jeton-cmd'));
    getSelection().removeAllRanges(); getSelection().addRange(plage);
    bouton.textContent = 'selectionne, Ctrl+C';
  }
  setTimeout(() => { bouton.textContent = 'Copier la commande'; }, 2500);
};

document.getElementById('btn-theme').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  sauver();
};
addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    fiche.classList.remove('visible'); etat.selection = null; dessiner();
  }
  if (ev.key === '/' && document.activeElement.tagName !== 'INPUT') {
    ev.preventDefault(); document.getElementById('recherche').focus();
  }
});
addEventListener('resize', () => appliquerVue());

// ------------------------------------------------------------------ demarrage
construireStats();
construireFiltres();

// Beaucoup de valeurs de filtres : on les replie au premier chargement pour
// laisser la place au schema. Le bouton Filtres les rouvre.
const nbValeurs = DONNEES.filtres.reduce((n, f) => n + f.valeurs.length, 0);
if (!localStorage.getItem(CLE) && nbValeurs > 18) {
  document.getElementById('filtres').classList.add('replie');
} else {
  document.getElementById('btn-filtres').classList.add('actif');
}

// Premiere visite sur un parc important : tout deplier donne une page de
// plusieurs milliers de pixels, illisible. On part replie, l'utilisateur
// ouvre ce qui l'interesse.
const SEUIL_REPLI = 60;
if (!localStorage.getItem(CLE)) {
  const invites = DONNEES.noeuds.filter(n => n.kind === 'vm').length;
  if (invites > SEUIL_REPLI) {
    DONNEES.noeuds.filter(n => n.kind === 'node' && n.enfants.length)
      .forEach(n => etat.plies.add(n.id));
    document.getElementById('btn-plier').textContent = 'Déplier';
  }
  dessiner();
  ajuster();
} else {
  dessiner();
}
</script>
</body>
</html>
